    <text x="156" y="83" fill="#000" opacity=".35" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="52" font-weight="900" font-style="italic" letter-spacing="-1">CREDITS</text>
    <text x="156" y="79" fill="url(#orange)" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="52" font-weight="900" font-style="italic" letter-spacing="-1">CREDITS</text>
    <path d="M60 103H1220" stroke="#697f9c" stroke-opacity=".25"/>
