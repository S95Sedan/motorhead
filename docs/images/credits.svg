<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="120" viewBox="0 0 1280 120" role="img" aria-labelledby="title desc">
  <title id="title">Credits</title>
  <desc id="desc">Orange racing typography on a dark technical grid with a sweeping circuit motif.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#101d35"/>
      <stop offset="1" stop-color="#060a12"/>
    </linearGradient>
    <linearGradient id="orange" x2="0" y2="1">
      <stop stop-color="#ffac48"/>
      <stop offset="1" stop-color="#ff6410"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
