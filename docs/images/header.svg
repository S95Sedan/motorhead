<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="240" viewBox="0 0 1280 240" role="img" aria-labelledby="title desc">
  <title id="title">Motorhead — Reconstruction Project</title>
  <desc id="desc">Orange racing typography, a sweeping circuit motif, and a dark technical grid.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#101d35"/>
      <stop offset="1" stop-color="#060a12"/>
    </linearGradient>
    <linearGradient id="orange" x2="0" y2="1">
      <stop stop-color="#ffac48"/>
      <stop offset="1" stop-color="#ff6410"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#8199be" stroke-opacity=".07"/>
    </pattern>
    <clipPath id="frame"><rect width="1280" height="240" rx="12"/></clipPath>
    <linearGradient id="fade"><stop stop-color="#0c1526"/><stop offset="1" stop-color="#0c1526" stop-opacity="0"/></linearGradient>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1280" height="320" fill="url(#background)"/>
    <rect x="720" width="560" height="320" fill="url(#grid)"/>
    <g fill="none" transform="translate(40 -24) skewX(-15)">
      <path d="M870 360V150Q870 76 944 76H1080Q1154 76 1154 150V164Q1154 238 1080 238H1006Q974 238 974 270V360" stroke="#20324d" stroke-width="64"/>
      <path d="M870 360V150Q870 76 944 76H1080Q1154 76 1154 150V164Q1154 238 1080 238H1006Q974 238 974 270V360" stroke="#7f9dc7" stroke-opacity=".28" stroke-width="2" stroke-dasharray="12 12"/>
      <path d="M838 324V150Q838 44 944 44H1080" stroke="#ff781c" stroke-width="4"/>
      <path d="M1186 150V164Q1186 270 1080 270H1006" stroke="#93a8c7" stroke-opacity=".45" stroke-width="2"/>
    </g>
    <rect x="685" width="240" height="320" fill="url(#fade)"/>
    <path d="M62 51H91L85 67H56Z M100 51H119L113 67H94Z M128 51H137L131 67H122Z" fill="#ff781c"/>
    <text x="156" y="64" fill="#acbcd3" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="3">RECONSTRUCTION</text>
    <text x="53" y="178" fill="#000" opacity=".35" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="98" font-weight="900" font-style="italic" letter-spacing="-4">MOTORHEAD</text>
    <text x="53" y="173" fill="url(#orange)" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="98" font-weight="900" font-style="italic" letter-spacing="-4">MOTORHEAD</text>
    <path d="M60 194H1220" stroke="#697f9c" stroke-opacity=".25"/>
  </g>
</svg>
