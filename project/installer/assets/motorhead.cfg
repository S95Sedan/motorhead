// Motorhead configuration file
// Copyright Digital Illusions CE AB 1998
// Control layouts are stored separately in User\Input.

[Player]
PlayerName              Player                   // Displayed player name
PlayerColour            255 255 255              // Player colour: Red Green Blue [0,255]
TeamName                                         // Team abbreviation, fewer than 5 characters
System                  Metric                   // Metric/Imperial
CustomCarColours        Off                      // Off/On: use the three custom car colours below
CarColour1              32 16 64                 // Primary colour: Red Green Blue [0,255]
CarColour2              64 16 32                 // Secondary colour: Red Green Blue [0,255]
CarColour3              208 208 208              // Detail colour: Red Green Blue [0,255]

[Input]
ControlName             Keyboard                 // Active .clo layout in User\Input
ShortKey0                                        // Player shortcut slots 0-9
ShortKey1
ShortKey2
ShortKey3
ShortKey4
ShortKey5
ShortKey6
ShortKey7
ShortKey8
ShortKey9

[Car]
CarName                 Resonic                  // Selected car
CarTransmission         Auto                     // Manual/Auto
CarView                 Inside                   // Inside/Outside
CarHorn                 Honker1                  // Selected horn

[Race]
GameType                Single                   // Single/League/TimeAttack/GhostMode
Difficulty              Medium                   // Easy/Medium/Hard
TrackName               RedRock                  // Selected track
TrackLaps               5                        // 1/3/5/10/15/25 laps
CatchUp                 Off                      // Off/On: catch-up assistance
LeagueName              Default                  // Selected league
RecordRace              Off                      // Off/On: save the race as a replay
DemoFileName            Bench1                   // Last selected replay

[Display]
Renderer                display                  // cliff/display render device
ScreenDimension         800 600                  // Window or output resolution: Width Height
AspectRatio             4:3                      // 4:3/16:9
WindowMode              Borderless               // Windowed/Borderless/Fullscreen
Brightness              100.00 100.00 100.00     // Red Green Blue brightness in percent
AGPMemory               Off                      // Off/On: use AGP memory when available
TrueColour              On                       // Off/On: 32-bit colour rendering
TrippleBuffer           On                       // Off/On: triple buffering (retail key spelling)
TriLinearFiltering      On                       // Off/On: trilinear texture filtering
TextureFormat           32                       // Texture colour depth: 8/16/32 bits

[RaceDisplay]
InfoDetail              All                      // None/Selective/All: race information
CheckpointInfo          All                      // None/Selective/All: checkpoint information
CheckpointDelay         4.00                     // Checkpoint display time in seconds [0,10]
RoadMap                 All                      // None/Selective/All: minimap detail

[Graphics]
DetailMode              Custom                   // Low/Medium/High/Max/Custom preset
LensFlares              On                       // Off/On: camera lens flares
Sparks                  On                       // Off/On: collision sparks
Smoke                   On                       // Off/On: tyre smoke
Halos                   On                       // Off/On: light halos
Shadow                  On                       // Off/On: car shadows
SkidMarks               On                       // Off/On: tyre marks
NamePlates              Transparent              // None/Flat/Transparent: names above other cars
SkyImage                On                       // Off/On: scrolling sky image
TrackDetail             High                     // Medium/High
CarDetail               High                     // Low/Medium/High
CarShading              Reflection               // Flat/Gouraud/Reflection/Glenz
PerspectiveOn           All                      // Selective/All: perspective-correct polygons
Perspective             Good                     // Normal/Good: perspective accuracy
ViewDistance            150.00                   // World render distance in percent [30,150]
MotionBlur              Off                      // Off/On
ZRead                   Off                      // Off/On: depth-buffer reads
CameraShake             On                       // Off/On: camera response to road vibration
UIScale                 100.00                   // Race interface scale in percent [50,150]

[Audio]
Sounder                 Aureal3D2.0              // Nosound/DirectSound/Aureal3D1.2/Aureal3D2.0
AudioOutputDevice                                // Empty uses the Windows default output
SFXVolume               37.65                    // Sound-effect volume in percent [0,100]
MusicVolume             37.65                    // Music volume in percent [0,100]
CDLoop                  On                       // Off/On: loop music tracks
MenuCDTrack             3                        // Menu music track [2,11]

[TrackMusic]
// Normal and reverse variants are kept together.
CDTrack_100             11                       // Goldbridge
CDTrack_110             11                       // Goldbridge Reverse
CDTrack_101             4                        // RedRock
CDTrack_111             4                        // RedRock Reverse
CDTrack_200             6                        // NeoCity
CDTrack_210             6                        // NeoCity Reverse
CDTrack_201             7                        // Atlantika
CDTrack_211             7                        // Atlantika Reverse
CDTrack_300             8                        // RuhrStadt
CDTrack_311             8                        // RuhrStadt Reverse
CDTrack_301             9                        // Olympos
CDTrack_312             9                        // Olympos Reverse
CDTrack_310             5                        // NolbyHills
CDTrack_313             5                        // NolbyHills Reverse
CDTrack_400             10                       // OkkunSpeedway
CDTrack_410             10                       // OkkunSpeedway Reverse

[Multiplayer]
SessionName             Session1                 // Default hosted-session name
SessionPassword                                  // Empty means no default password
ProtocolNew             WinSock                  // WinSock/IPX/TCP/DialUp/Serial
WinSockPort             16000                    // Network port [1,65535]
PredictionMin           1                        // Minimum player prediction [0,10]
PredictionMax           5                        // Maximum player prediction [0,10]
RateIPX                 30                       // IPX updates per second
RateTCP                 15                       // TCP updates per second
RateDialUp              15                       // Dial-up updates per second
RateSerial              15                       // Serial updates per second
RateWinSock             15                       // WinSock updates per second

[Serial]
SerialPort              2                        // COM port number: 1/2/3/4
BaudRate                57600                    // Serial baud rate
Parity                  None                     // None/Odd/Even/Mark
StopBits                1                        // 1/2/1-5
FlowControl             RTSDTR                   // None/DTR/RTSDTR/RTS/XONXOFF

[Paths]
HiscorePath             HiScores\                // High-score directory, relative to the data root
AddressBookPath         AddressBook\             // Address-book directory, relative to the data root

[Menu]
SkipIntroMovies         Off                      // On=skip movies; Off=key skips all; Single=key skips one
MenuConfirmation        On                       // Off/On/NoExit: menu confirmation prompts
MenuMouse               On                       // Off/On: mouse input in menus
MenuJoystick            On                       // Off/On: joystick input in menus
DemoLength              40                       // Attract-mode race length in seconds [10,600]

/////////////////////////////////////////// EOF CONFIG FILE //////////
